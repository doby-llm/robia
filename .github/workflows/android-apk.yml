name: Android APK CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Build the signed Play release AAB'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release != true)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Configure stable CI debug signing key
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -z "${ROBIA_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "No stable CI debug keystore secret configured; Gradle will use the default debug signing key."
            exit 0
          fi
          for required in ROBIA_DEBUG_KEYSTORE_PASSWORD ROBIA_DEBUG_KEY_ALIAS ROBIA_DEBUG_KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "${required} is required when ROBIA_DEBUG_KEYSTORE_BASE64 is set" >&2
              exit 1
            fi
          done
          signing_dir="${RUNNER_TEMP}/robia-debug-signing"
          mkdir -p "${signing_dir}"
          keystore_path="${signing_dir}/robia-ci-debug.jks"
          printf '%s' "${ROBIA_DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ROBIA_DEBUG_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"
          echo "ROBIA_DEBUG_KEYSTORE_PASSWORD=${ROBIA_DEBUG_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ROBIA_DEBUG_KEY_ALIAS=${ROBIA_DEBUG_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ROBIA_DEBUG_KEY_PASSWORD=${ROBIA_DEBUG_KEY_PASSWORD}" >> "${GITHUB_ENV}"
          echo "Stable CI debug signing key configured. Register this SHA-1 for GitHub Actions debug APK OAuth testing:"
          keytool -list -v \
            -keystore "${keystore_path}" \
            -storepass "${ROBIA_DEBUG_KEYSTORE_PASSWORD}" \
            -alias "${ROBIA_DEBUG_KEY_ALIAS}" | grep -E 'SHA1:|SHA256:'
        env:
          ROBIA_DEBUG_KEYSTORE_BASE64: ${{ secrets.ROBIA_DEBUG_KEYSTORE_BASE64 }}
          ROBIA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ROBIA_DEBUG_KEYSTORE_PASSWORD }}
          ROBIA_DEBUG_KEY_ALIAS: ${{ secrets.ROBIA_DEBUG_KEY_ALIAS }}
          ROBIA_DEBUG_KEY_PASSWORD: ${{ secrets.ROBIA_DEBUG_KEY_PASSWORD }}

      - name: Build debug, staging and capture APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleStaging assembleCapture

      - name: Check capture APK package name
        run: |
          set -euo pipefail
          build_tools_dir="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          apk_path="$(find app/build/outputs/apk/capture -name '*.apk' -type f | sort | head -n 1)"
          if [ -z "${apk_path}" ]; then
            echo "No capture APK found" >&2
            exit 1
          fi
          badging="$("${build_tools_dir}/aapt2" dump badging "${apk_path}")"
          package_line="$(grep -m 1 '^package:' <<< "${badging}")"
          echo "${package_line}"
          grep -q "name='com.gusanitolabs.robia.capture'" <<< "${package_line}"

      - name: Print APK signing certificate fingerprints
        run: |
          set -euo pipefail
          build_tools_dir="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          echo "This fingerprint is safe to publish, but the default GitHub Actions debug signing key can change between runs."
          echo "For Google OAuth, use this only for the exact debug APK/build you are testing; use Play/release signing fingerprints for production."
          for apk_dir in app/build/outputs/apk/debug app/build/outputs/apk/staging app/build/outputs/apk/capture; do
            apk_path="$(find "${apk_dir}" -name '*.apk' -type f | sort | head -n 1)"
            if [ -z "${apk_path}" ]; then
              echo "No APK found in ${apk_dir} for signing certificate inspection" >&2
              exit 1
            fi
            echo "Inspecting signing certificate for ${apk_path}"
            "${build_tools_dir}/aapt2" dump badging "${apk_path}" | grep -m 1 '^package:' || true
            "${build_tools_dir}/apksigner" verify --print-certs "${apk_path}"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: robia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: robia-staging-apk
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error

      - name: Upload capture APK
        uses: actions/upload-artifact@v4
        with:
          name: robia-capture-apk
          path: app/build/outputs/apk/capture/*.apk
          if-no-files-found: error

      - name: Upload staging R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robia-staging-r8-mapping
          path: app/build/outputs/mapping/staging/mapping.txt
          if-no-files-found: warn

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: warn

  release-aab:
    name: Build signed release AAB
    if: github.event_name == 'workflow_dispatch' && inputs.release == true || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Configure release signing key
        run: |
          set -euo pipefail
          missing=0
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "${required} is required for the release AAB job" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "::add-mask::${ANDROID_KEYSTORE_PASSWORD}"
          echo "::add-mask::${ANDROID_KEY_ALIAS}"
          echo "::add-mask::${ANDROID_KEY_PASSWORD}"
          signing_dir="${RUNNER_TEMP}/robia-release-signing"
          mkdir -p "${signing_dir}"
          keystore_path="${signing_dir}/robia-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Set release versionCode from the CI run number
        run: echo "ROBIA_VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))" >> "${GITHUB_ENV}"

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Check release AAB is arm64-only and 16 KB aligned
        run: python3 scripts/check_aab_16kb.py app/build/outputs/bundle/release/app-release.aab

      - name: Verify and package release artifact metadata
        run: |
          set -euo pipefail
          aab_path="$(find app/build/outputs/bundle/release -name '*.aab' -type f | sort | head -n 1)"
          if [ -z "${aab_path}" ]; then
            echo "No release AAB found" >&2
            exit 1
          fi
          # The upload key is self-signed, so jarsigner reports self-signed/PKIX findings
          # (exit 0 without -strict, exit 4 with it). Accept only that; unsigned, invalid
          # or otherwise broken jars must fail.
          verify_log="${RUNNER_TEMP}/jarsigner-verify.log"
          set +e
          jarsigner -verify -certs "${aab_path}" > "${verify_log}" 2>&1
          verify_rc=$?
          set -e
          cat "${verify_log}"
          verify_ok=1
          if [ "${verify_rc}" -ne 0 ] && [ "${verify_rc}" -ne 4 ]; then
            verify_ok=0
          fi
          if ! grep -q '^jar verified' "${verify_log}"; then
            verify_ok=0
          fi
          if grep -Eiq 'jar is unsigned|no manifest|unsigned entries|digest error' "${verify_log}"; then
            verify_ok=0
          fi
          if grep -i 'invalid' "${verify_log}" | grep -qv '^This jar contains entries whose certificate chain is invalid\. Reason: PKIX path building failed: '; then
            verify_ok=0
          fi
          unexpected_errors="$(awk '/^Error:/ {in_error = 1; next} /^$/ || /^(Warning:|Re-run with)/ {in_error = 0} in_error' "${verify_log}" \
            | grep -Ev '^This jar contains entries whose signer certificate is self-signed\.$|^This jar contains entries whose certificate chain is invalid\. Reason: PKIX path building failed: ' || true)"
          if [ -n "${unexpected_errors}" ]; then
            echo "Unexpected jarsigner error(s):" >&2
            echo "${unexpected_errors}" >&2
            verify_ok=0
          fi
          if [ "${verify_ok}" -ne 1 ]; then
            echo "jarsigner verification failed (exit ${verify_rc}); only self-signed upload-key findings are accepted" >&2
            exit 1
          fi
          echo "jarsigner accepted the AAB: only self-signed upload-key findings (exit ${verify_rc})"

          # The AAB must be signed by the upload key in the keystore, not by any other certificate.
          aab_sha256="$(keytool -printcert -jarfile "${aab_path}" | sed -n 's/^[[:space:]]*SHA256: //p')"
          key_sha256="$(keytool -list -keystore "${ANDROID_KEYSTORE_PATH}" -alias "${ANDROID_KEY_ALIAS}" -storepass:env ANDROID_KEYSTORE_PASSWORD -noprompt | sed -n 's/^Certificate fingerprint (SHA-256): //p')"
          sha256_re='^([0-9A-F]{2}:){31}[0-9A-F]{2}$'
          if ! [[ "${aab_sha256}" =~ ${sha256_re} ]] || ! [[ "${key_sha256}" =~ ${sha256_re} ]]; then
            echo "Could not read exactly one SHA-256 signer fingerprint from the AAB and the upload key" >&2
            exit 1
          fi
          if [ "${aab_sha256}" != "${key_sha256}" ]; then
            echo "AAB signer SHA-256 ${aab_sha256} does not match upload key SHA-256 ${key_sha256}" >&2
            exit 1
          fi
          echo "AAB signed by upload key, SHA-256: ${aab_sha256}"

          sha256sum "${aab_path}" > "${aab_path}.sha256"
          version_name="$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit('versionName not found')
          print(match.group(1))
          PY
          )"
          version_code="${ROBIA_VERSION_CODE}"
          metadata_dir="app/build/outputs/bundle/release/metadata"
          mkdir -p "${metadata_dir}"
          {
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "versionName=${version_name}"
            echo "versionCode=${version_code}"
            echo "aab=$(basename "${aab_path}")"
            echo "sha256=$(cut -d ' ' -f 1 "${aab_path}.sha256")"
          } > "${metadata_dir}/release-metadata.txt"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: robia-release-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.sha256
            app/build/outputs/bundle/release/metadata/release-metadata.txt
          if-no-files-found: error

      - name: Upload release R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: robia-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
