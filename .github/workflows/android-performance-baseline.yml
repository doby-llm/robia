name: Android performance baseline

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Seconds to continuously scroll each 60-item fixture screen
        required: false
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  emulator-baseline:
    name: Comparative emulator baseline
    # macOS GitHub-hosted runners provide reliable hardware acceleration for
    # Android Emulator. The previous Linux runner booted API 35 without KVM and
    # timed out; this job intentionally remains a remote comparative emulator
    # baseline, not a physical-device benchmark.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check performance baseline workflow contract
        run: python3 scripts/check_android_performance_baseline_workflow_static.py
      - name: Check image thumbnail pipeline contract
        run: python3 scripts/check_image_thumbnail_pipeline_static.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare failure artifact directory
        run: mkdir -p performance-artifacts
      - name: Generate synthetic fixtures
        run: |
          python -m pip install --disable-pip-version-check Pillow==10.4.0
          python scripts/generate_performance_fixtures.py --output performance-fixtures
      - name: Build debug APK for emulator comparison
        run: gradle --no-daemon assembleDebug
      - name: Capture Browse and Batch baseline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # android-emulator-runner invokes each script line with /bin/sh -c, so
          # keep capture as one folded command while retaining POSIX -e/-u.
          # The app accepts these debug-only synthetic fixture extras. Fixtures are copied into
          # app-private FileProvider storage; no personal image or URI is recorded.
          script: >-
            sh -eu -c 'set -eu; mkdir -p performance-artifacts; trap '"'"'status=$?; if [ "$status" -ne 0 ]; then [ -s performance-artifacts/capture-failure.txt ] || printf "capture step failed with exit status %s\n" "$status" > performance-artifacts/capture-failure.txt; adb devices > performance-artifacts/adb-devices.txt 2>&1 || true; adb logcat -d -v threadtime > performance-artifacts/logcat.txt 2>&1 || true; fi; exit "$status"'"'"' EXIT; adb install -r app/build/outputs/apk/debug/app-debug.apk; STAGING_DIR=/data/local/tmp/robia-performance-fixtures; APP_FIXTURE_DIR=files/robia_clothing_images; adb shell rm -rf "$STAGING_DIR"; adb shell mkdir -p "$STAGING_DIR"; adb push performance-fixtures/. "$STAGING_DIR"; adb shell chmod -R 755 "$STAGING_DIR"; adb shell "run-as com.gusanitolabs.robia sh -c '"'"'set -eu; rm -rf ${APP_FIXTURE_DIR}; mkdir -p ${APP_FIXTURE_DIR}; cp ${STAGING_DIR}/fixture-*.jpg ${APP_FIXTURE_DIR}/'"'"'"; fixture_count=$(adb shell "run-as com.gusanitolabs.robia sh -c '"'"'ls ${APP_FIXTURE_DIR}/fixture-*.jpg 2>/dev/null | wc -l'"'"'" | tr -d "[:space:]"); [ "$fixture_count" = "60" ]; adb shell rm -rf "$STAGING_DIR"; URIS=$(python -c '"'"'import json; base = "content://com.gusanitolabs.robia.fileprovider/private_clothing_images/"; manifest = json.load(open("performance-fixtures/manifest.json")); print(",".join(base + item["path"] for item in manifest["fixtures"]))'"'"'); PACKAGE=com.gusanitolabs.robia; ACTIVITY="$PACKAGE/.MainActivity"; LAUNCH_OUTPUT=performance-artifacts/launch-output.txt; adb shell am force-stop "$PACKAGE"; LAUNCH_STATUS=0; adb shell am start -n "$ACTIVITY" --esa "$PACKAGE.PERFORMANCE_FIXTURE_URIS" "$URIS" --ez "$PACKAGE.PERFORMANCE_BATCH" true > "$LAUNCH_OUTPUT" 2>&1 || LAUNCH_STATUS=$?; cat "$LAUNCH_OUTPUT"; printf "launch_exit_status=%s\n" "$LAUNCH_STATUS" > performance-artifacts/launch-status.txt; if [ "$LAUNCH_STATUS" -ne 0 ]; then printf "Robia launch command failed with exit status %s; see launch-output.txt\n" "$LAUNCH_STATUS" > performance-artifacts/capture-failure.txt; adb shell dumpsys activity activities > performance-artifacts/activity-state.txt 2>&1 || true; adb shell dumpsys package "$PACKAGE" > performance-artifacts/package-dump.txt 2>&1 || true; exit 1; fi; if grep -Eq "Error:|Exception" "$LAUNCH_OUTPUT"; then printf "Robia launch command reported an error; see launch-output.txt\n" > performance-artifacts/capture-failure.txt; adb shell dumpsys activity activities > performance-artifacts/activity-state.txt 2>&1 || true; adb shell dumpsys package "$PACKAGE" > performance-artifacts/package-dump.txt 2>&1 || true; exit 1; fi; READINESS_TIMEOUT_SECONDS=45; READINESS_DEADLINE=$(( $(date +%s) + READINESS_TIMEOUT_SECONDS )); PACKAGE_REGEX=com[.]gusanitolabs[.]robia; ROBIA_PID=; LAST_ROBIA_PID=; STABLE_READINESS_SAMPLES=0; READINESS_REASON="not checked"; while [ "$(date +%s)" -le "$READINESS_DEADLINE" ]; do ROBIA_PID=$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d "[:space:]") || ROBIA_PID=; adb shell dumpsys activity activities > performance-artifacts/activity-state.txt 2>&1 || true; adb shell dumpsys window windows > performance-artifacts/window-state.txt 2>&1 || true; if [ -z "$ROBIA_PID" ]; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="pidof did not return a Robia process"; elif [ "$ROBIA_PID" != "$LAST_ROBIA_PID" ]; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="Robia pid is not stable yet"; elif ! grep -Fq "$ACTIVITY" performance-artifacts/activity-state.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="MainActivity is not present in activity state"; elif ! grep -Eq "topResumedActivity|mResumedActivity|ResumedActivity" performance-artifacts/activity-state.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="MainActivity is not resumed"; elif ! grep -Eq "app=ProcessRecord\\{[^}]*[[:space:]]${ROBIA_PID}:${PACKAGE_REGEX}" performance-artifacts/activity-state.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="MainActivity is not attached to the stable Robia process"; elif ! grep -Fq "reportedDrawn=true" performance-artifacts/activity-state.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="MainActivity has not reported drawn"; elif ! grep -Fq "firstWindowDrawn=true" performance-artifacts/activity-state.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="MainActivity first window is not drawn"; elif grep -Eq "mCurrentFocus=.*Splash Screen|mFocusedApp=.*Splash Screen" performance-artifacts/window-state.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="Splash Screen is still the focused window"; elif ! grep -Eq "mCurrentFocus=.*${PACKAGE_REGEX}/|mFocusedApp=.*${PACKAGE_REGEX}/[.]MainActivity|mFocusedApp=.*${PACKAGE_REGEX}/${PACKAGE_REGEX}[.]MainActivity" performance-artifacts/window-state.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="Robia activity window is not focused or visible"; else adb shell dumpsys meminfo "$PACKAGE" > performance-artifacts/readiness-meminfo.txt 2>&1 || true; adb shell dumpsys gfxinfo "$PACKAGE" > performance-artifacts/readiness-gfxinfo.txt 2>&1 || true; if ! grep -Eq "^[[:space:]]*TOTAL[[:space:]]+[0-9]+" performance-artifacts/readiness-meminfo.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="readiness meminfo does not contain parseable TOTAL PSS"; elif ! grep -Eq "Janky frames:|Total frames rendered:" performance-artifacts/readiness-gfxinfo.txt; then STABLE_READINESS_SAMPLES=0; READINESS_REASON="readiness gfxinfo does not contain parseable frame evidence"; else STABLE_READINESS_SAMPLES=$((STABLE_READINESS_SAMPLES + 1)); READINESS_REASON="stable visible readiness sample captured"; if [ "$STABLE_READINESS_SAMPLES" -ge 2 ]; then break; fi; fi; fi; LAST_ROBIA_PID="$ROBIA_PID"; sleep 1; done; if [ "$STABLE_READINESS_SAMPLES" -lt 2 ]; then printf "Robia stable visible readiness failed after %ss; reason=%s; pid=%s; expected_activity=%s\n" "$READINESS_TIMEOUT_SECONDS" "$READINESS_REASON" "${ROBIA_PID:-missing}" "$ACTIVITY" > performance-artifacts/capture-failure.txt; adb shell ps -A | grep "$PACKAGE" > performance-artifacts/robia-ps.txt 2>&1 || true; adb shell dumpsys package "$PACKAGE" > performance-artifacts/package-dump.txt 2>&1 || true; adb shell dumpsys window windows > performance-artifacts/window-state.txt 2>&1 || true; exit 1; fi; printf "Robia stable visible readiness pid=%s activity=%s stable_samples=%s reason=%s\n" "$ROBIA_PID" "$ACTIVITY" "$STABLE_READINESS_SAMPLES" "$READINESS_REASON" > performance-artifacts/launch-readiness.txt; sleep 8; DURATION=${{ inputs.duration_seconds }}; TRACE_DURATION=$((DURATION + 5)); adb shell dumpsys gfxinfo com.gusanitolabs.robia reset; adb shell am send-trim-memory com.gusanitolabs.robia RUNNING_CRITICAL || true; adb shell dumpsys meminfo com.gusanitolabs.robia > performance-artifacts/meminfo-before.txt; adb shell perfetto -o /data/misc/perfetto-traces/robia-baseline.perfetto-trace -t "${TRACE_DURATION}s" sched freq gfx view wm am >/dev/null 2>&1 & PERFETTO_ADB_PID=$!; end=$(( $(date +%s) + DURATION )); while [ "$(date +%s)" -lt "$end" ]; do adb shell input swipe 540 1700 540 350 250; adb shell input swipe 540 350 540 1700 250; done; wait "$PERFETTO_ADB_PID" || true; adb shell dumpsys gfxinfo com.gusanitolabs.robia > performance-artifacts/gfxinfo.txt; adb pull /data/misc/perfetto-traces/robia-baseline.perfetto-trace performance-artifacts/ || true; adb shell dumpsys meminfo com.gusanitolabs.robia > performance-artifacts/meminfo-after.txt; adb logcat -d -v threadtime RobiaPerformance:I "*:S" > performance-artifacts/batch-stages.log || true; grep -Eq "^[[:space:]]*TOTAL[[:space:]]+[0-9]+" performance-artifacts/meminfo-before.txt || { printf "meminfo-before.txt does not contain parseable TOTAL PSS\n" > performance-artifacts/capture-failure.txt; exit 1; }; grep -Eq "^[[:space:]]*TOTAL[[:space:]]+[0-9]+" performance-artifacts/meminfo-after.txt || { printf "meminfo-after.txt does not contain parseable TOTAL PSS\n" > performance-artifacts/capture-failure.txt; exit 1; }; grep -Eq "Janky frames:|Total frames rendered:" performance-artifacts/gfxinfo.txt || { printf "gfxinfo.txt does not contain parseable frame evidence\n" > performance-artifacts/capture-failure.txt; exit 1; }; grep -q "batch_stage" performance-artifacts/batch-stages.log || { printf "batch-stages.log contains no sanitized batch_stage records\n" > performance-artifacts/capture-failure.txt; exit 1; }; for image_stage in resolve decode bind first_draw in_flight_wait placeholder_visible eviction; do grep -Eq "stage=${image_stage}([[:space:]]|$)" performance-artifacts/batch-stages.log || { printf "batch-stages.log is missing required sanitized RobiaPerformance image stage: %s\n" "$image_stage" > performance-artifacts/capture-failure.txt; exit 1; }; done; cp performance-fixtures/manifest.json performance-artifacts/fixture-manifest.json; python scripts/summarize_performance_baseline.py --input performance-artifacts --output performance-artifacts/report.md'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robia-emulator-performance-baseline
          path: performance-artifacts
          if-no-files-found: error
          retention-days: 30