name: Android performance baseline

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Seconds to continuously scroll each 60-item fixture screen
        required: false
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  emulator-baseline:
    name: Comparative emulator baseline
    # macOS GitHub-hosted runners provide reliable hardware acceleration for
    # Android Emulator. The previous Linux runner booted API 35 without KVM and
    # timed out; this job intentionally remains a remote comparative emulator
    # baseline, not a physical-device benchmark.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check performance baseline workflow contract
        run: python3 scripts/check_android_performance_baseline_workflow_static.py
      - name: Check image thumbnail pipeline contract
        run: python3 scripts/check_image_thumbnail_pipeline_static.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare failure artifact directory
        run: mkdir -p performance-artifacts
      - name: Generate synthetic fixtures
        run: |
          python -m pip install --disable-pip-version-check Pillow==10.4.0
          python scripts/generate_performance_fixtures.py --output performance-fixtures
      - name: Build debug APK for emulator comparison
        run: gradle --no-daemon assembleDebug
      - name: Capture Browse and Batch baseline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # android-emulator-runner invokes each script line with /bin/sh -c, so
          # keep capture as one folded command while retaining POSIX -e/-u.
          # The app accepts these debug-only synthetic fixture extras. No personal image or URI is recorded.
          script: >-
            sh -eu -c 'set -eu; mkdir -p performance-artifacts; trap '"'"'status=$?; if [ "$status" -ne 0 ]; then printf "capture step failed with exit status %s\n" "$status" > performance-artifacts/capture-failure.txt; adb devices > performance-artifacts/adb-devices.txt 2>&1 || true; adb logcat -d -v threadtime > performance-artifacts/logcat.txt 2>&1 || true; fi; exit "$status"'"'"' EXIT; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb shell mkdir -p /sdcard/Android/data/com.gusanitolabs.robia/files/Pictures/robia_clothing_images; adb push performance-fixtures/. /sdcard/Android/data/com.gusanitolabs.robia/files/Pictures/robia_clothing_images; URIS=$(python -c '"'"'import json; base = "content://com.gusanitolabs.robia.fileprovider/clothing_images/"; manifest = json.load(open("performance-fixtures/manifest.json")); print(",".join(base + item["path"] for item in manifest["fixtures"]))'"'"'); adb shell am force-stop com.gusanitolabs.robia; adb shell am start -W -n com.gusanitolabs.robia/.MainActivity --esa com.gusanitolabs.robia.PERFORMANCE_FIXTURE_URIS "$URIS" --ez com.gusanitolabs.robia.PERFORMANCE_BATCH true; sleep 8; DURATION=${{ inputs.duration_seconds }}; TRACE_DURATION=$((DURATION + 5)); adb shell dumpsys gfxinfo com.gusanitolabs.robia reset; adb shell am send-trim-memory com.gusanitolabs.robia RUNNING_CRITICAL || true; adb shell dumpsys meminfo com.gusanitolabs.robia > performance-artifacts/meminfo-before.txt || true; adb shell perfetto -o /data/misc/perfetto-traces/robia-baseline.perfetto-trace -t "${TRACE_DURATION}s" sched freq gfx view wm am >/dev/null 2>&1 & PERFETTO_ADB_PID=$!; end=$(( $(date +%s) + DURATION )); while [ "$(date +%s)" -lt "$end" ]; do adb shell input swipe 540 1700 540 350 250; adb shell input swipe 540 350 540 1700 250; done; wait "$PERFETTO_ADB_PID" || true; adb shell dumpsys gfxinfo com.gusanitolabs.robia > performance-artifacts/gfxinfo.txt; adb pull /data/misc/perfetto-traces/robia-baseline.perfetto-trace performance-artifacts/ || true; adb shell dumpsys meminfo com.gusanitolabs.robia > performance-artifacts/meminfo-after.txt || true; adb logcat -d -v threadtime RobiaPerformance:I "*:S" > performance-artifacts/batch-stages.log || true; cp performance-fixtures/manifest.json performance-artifacts/fixture-manifest.json; python scripts/summarize_performance_baseline.py --input performance-artifacts --output performance-artifacts/report.md'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robia-emulator-performance-baseline
          path: performance-artifacts
          if-no-files-found: error
          retention-days: 30
